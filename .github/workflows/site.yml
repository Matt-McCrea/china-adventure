# Builds and deploys the site to GitHub Pages, and turns journal emails into posts.
#   push to main          → build + deploy
#   every 15 min / manual → check the journal inbox; if there are new posts, commit them, then build + deploy
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.ingest.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - id: ingest
        working-directory: app
        run: npx tsx scripts/ingest-mail.ts
        env:
          JOURNAL_IMAP_USER: ${{ secrets.JOURNAL_IMAP_USER }}
          JOURNAL_IMAP_PASS: ${{ secrets.JOURNAL_IMAP_PASS }}
          JOURNAL_SENDERS: ${{ secrets.JOURNAL_SENDERS }}
      - if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "journal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/journal
          git commit -m "Journal: new post(s)"
          git pull --rebase
          git push

  deploy:
    needs: ingest
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.ingest.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: pages
        uses: actions/deploy-pages@v4
